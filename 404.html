<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>면접 질문 및 모범 답변 - Interview Master</title>

  <style>
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif;
      background-color: #fafafa;
      color: #111;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    header {
      background: #3b82f6;
      color: #fff;
      text-align: center;
      padding: 14px;
      font-size: 20px;
      font-weight: 600;
    }
    .container {
      max-width: 880px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      padding: 28px 40px;
    }
    h1 {
      border-bottom: 2px solid #60a5fa;
      padding-bottom: 6px;
    }
    h2 {
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 3px;
      color: #333;
    }
    .button-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      opacity: 0.85;
    }
    .save-btn {
      background: #2563eb;
      color: #fff;
    }
    .docx-btn {
      background: #facc15;
      color: #000;
    }
    .preview {
      white-space: pre-wrap;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <header>면접 질문 및 모범 답변 미리보기</header>

  <div class="container">
    <div id="preview" class="preview">
      <h1>예시 출력</h1>
      <p>이 영역에 면접 질문 및 모범 답변이 표시됩니다.</p>
    </div>

    <div class="button-row">
      <button class="save-btn" id="pdfSaveBtn">📄 PDF로 저장</button>
      <button class="docx-btn" id="docxSaveBtn">.DOCX로 저장</button>
    </div>
  </div>

  <!-- marked.js / DOMPurify (미리보기 렌더링용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>

  <!-- html2pdf.js (클라이언트 PDF 생성용, fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    // ==========================
    // (1) 미리보기 렌더링
    // ==========================
    function renderMarkdown(mdText) {
      const safeHtml = DOMPurify.sanitize(marked.parse(mdText || ""));
      document.getElementById("preview").innerHTML = safeHtml;
    }

    // ==========================
    // (2) PDF로 저장 (Playwright API 호출 → fallback은 html2pdf)
    // ==========================
    document.getElementById("pdfSaveBtn").addEventListener("click", async () => {
      const html = document.getElementById("preview").innerHTML;
      try {
        const res = await fetch("/export/pdf-playwright", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ html }),
        });

        if (!res.ok) throw new Error("서버 오류: " + res.status);
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "면접_질문+답변.pdf";
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (err) {
        console.warn("서버 렌더링 실패, 클라이언트 fallback 사용:", err);
        const element = document.getElementById("preview");
        const opt = {
          margin: 10,
          filename: "면접_질문+답변.pdf",
          html2canvas: { scale: 2 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
        };
        html2pdf().set(opt).from(element).save();
      }
    });

    // ==========================
    // (3) DOCX로 저장
    // ==========================
    document.getElementById("docxSaveBtn").addEventListener("click", async () => {
      const html = document.getElementById("preview").innerHTML;
      const res = await fetch("/export/docx-html", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ html }),
      });
      if (!res.ok) {
        alert("DOCX 생성 실패 (서버 오류)");
        return;
      }
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "면접_질문+답변.docx";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // (테스트용 예시)
    renderMarkdown(`# 면접 질문 예시\n\n**질문:** 지원 동기를 말해보세요.\n\n**모범 답변:** 저는...`);
  </script>
</body>
</html>
